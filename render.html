<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<canvas id="out" width="1080" height="1920"></canvas>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1080, H = 1920;
const name = new URLSearchParams(location.search).get('scene');
const mod = (await import(`/scenes/${name}.js`)).default;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, W / H, 0.01, 2000);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.6, 0.4, 0.35);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const ctx = { THREE, scene, camera, renderer, bloom };
await mod.setup(ctx);

const out = document.getElementById('out').getContext('2d');
const brand = mod.brand ?? 'MYSTERY MINUTE';

function caption(text, t, t0, t1) {
  const fade = 0.25;
  const a = Math.min(1, (t - t0) / fade, (t1 - t) / fade);
  const pop = 1 + 0.12 * Math.max(0, 1 - (t - t0) / 0.18);
  out.save();
  out.globalAlpha = Math.max(0, a);
  out.translate(W / 2, H * 0.72);
  out.scale(pop, pop);
  out.font = '900 76px "DejaVu Sans", Arial, sans-serif';
  out.textAlign = 'center'; out.textBaseline = 'middle';
  out.lineJoin = 'round';
  // word wrap
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (out.measureText(test).width > W * 0.8 && line) { lines.push(line); line = w; } else line = test;
  }
  lines.push(line);
  const lh = 94, y0 = -((lines.length - 1) * lh) / 2;
  lines.forEach((l, i) => {
    out.lineWidth = 14; out.strokeStyle = 'rgba(0,0,0,0.9)';
    out.strokeText(l, 0, y0 + i * lh);
    out.fillStyle = i === 0 && mod.highlightFirst ? '#ffd24a' : '#fff';
    out.fillText(l, 0, y0 + i * lh);
  });
  out.restore();
}

window.meta = { fps: mod.fps ?? 30, duration: mod.duration };
window.renderFrame = (i) => {
  const t = i / window.meta.fps;
  mod.update(t, ctx);
  composer.render();
  out.globalAlpha = 1;
  out.drawImage(renderer.domElement, 0, 0, W, H);
  // global fade
  const fadeIn = Math.min(1, t / 0.6), fadeOut = Math.min(1, (mod.duration - t) / 0.8);
  const vis = Math.min(fadeIn, fadeOut);
  if (vis < 1) { out.fillStyle = `rgba(0,0,0,${1 - vis})`; out.fillRect(0, 0, W, H); }
  // brand tag
  out.globalAlpha = 0.85; out.font = '700 34px "DejaVu Sans", Arial, sans-serif';
  out.textAlign = 'center'; out.fillStyle = '#fff'; out.letterSpacing = '8px';
  out.fillText(brand, W / 2, 170); out.letterSpacing = '0px';
  for (const c of mod.captions) if (t >= c.t0 && t < c.t1) caption(c.text, t, c.t0, c.t1);
  return document.getElementById('out').toDataURL('image/jpeg', 0.92).split(',')[1];
};
window.ready = true;
</script></body></html>
