{ const pm = new THREE.PMREMGenerator(renderer); const hdr = await new RGBELoader().loadAsync('/echo/assets/tex/moonless_golf_1k.hdr'); scene.environment = pm.fromEquirectangular(hdr).texture; scene.environmentIntensity = 0.35; }
// ---------- Hilfen ----------
let seed = 1;

}

const texL = new THREE.TextureLoader(); const tex = (f, r = 1) => { const t = texL.load(`/echo/assets/tex/${f}`); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(r, r); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

function ground(col, size = 120) { const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size, 60, 60), std(col, { map: TEX.grass })); const p = m.geometry.attributes.position; for (let i = 0; i < p.count; i++) p.setZ(i, (rnd() - 0.5) * 0.25); m.geometry.computeVertexNormals(); m.rotation.x = -Math.PI / 2; m.receiveShadow = true; return m; }

      const joint = /joint/i.test(o.material?.name || o.name);

      else o.material = new THREE.MeshStandardMaterial({ color: joint ? def.joints : def.surface, roughness: joint ? 0.4 : 0.75, metalness: joint ? 0.5 : 0.05 }); } });

// Figuren-Instanzen
const chars = await loadChars();
Object.values(chars).forEach(c => { c.visible = false; scene.add(c); });

// ---------- Kamera ----------
const ease = p => p * p * (3 - 2 * p);
function anchor(shot, key) {
  const set = sets[shot.set];
  if (key && chars[key]) { const c = chars[key]; c.updateMatrixWorld(true); if (c.userData.head) return c.userData.head.getWorldPosition(new THREE.Vector3()); return c.position.clone().add(new THREE.Vector3(0, 1.6, 0)); }

function placeCamera(shot, lt, p, t) {

    camera.position.set(Math.sin(t * 3.1) * 0.05, 1.6 + Math.abs(Math.sin(t * 6.2)) * 0.05, z);
    camera.lookAt(0, 1.5, z - 10);

}

// ---------- Overlay (2D) ----------
const out = document.getElementById('out').getContext('2d');
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const g = grain.getContext('2d'), d = g.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }
const SPK = { lena: ['LENA', '#ff6b6b'], mats: ['MATS', '#8fd18a'], uhrmacher: ['DER UHRMACHER', '#ffd27a'], erz: [null, '#ffffff'] };
function wrap(text, maxW) { const words = text.split(' '), lines = []; let l = ''; for (const w of words) { const t = l ? l + ' ' + w : w; if (out.measureText(t).width > maxW && l) { lines.push(l); l = w; } else l = t; } lines.push(l); return lines; }
function subtitle(s, t) {
  const p = (t - s.t0) / (s.t1 - s.t0), a = Math.min(1, (t - s.t0) / 0.15, (s.t1 - t) / 0.15);
  out.save(); out.globalAlpha = Math.max(0, a); out.textAlign = 'center'; out.textBaseline = 'middle'; out.lineJoin = 'round';
  const [label, col] = SPK[s.who] || SPK.erz; const italic = s.who === 'erz' ? 'italic ' : '';
  out.font = `${italic}800 64px "DejaVu Sans", Arial, sans-serif`;
  const words = s.text.split(' '); const shown = Math.max(1, Math.ceil(words.length * Math.min(1, p * 1.25 + 0.05)));
  const lines = wrap(s.text, W * 0.82); let count = 0; const lh = 80, y0 = H * 0.715 - ((lines.length - 1) * lh) / 2;
  if (label) { out.font = '800 34px "DejaVu Sans", Arial, sans-serif'; out.letterSpacing = '6px'; out.lineWidth = 8; out.strokeStyle = 'rgba(0,0,0,.85)'; out.strokeText(label, W / 2, y0 - 72); out.fillStyle = col; out.fillText(label, W / 2, y0 - 72); out.letterSpacing = '0px'; }
  out.font = `${italic}800 64px "DejaVu Sans", Arial, sans-serif`;
  lines.forEach((ln, i) => {
    const ws = ln.split(' '); const vis = ws.filter((_, j) => count + j < shown).join(' '); count += ws.length;
    const full = out.measureText(ln).width; const x0 = W / 2 - full / 2;

}

// ---------- Frame ----------
const shotAt = t => TL.shots.find(s => t >= s.t0 && t < s.t1) || TL.shots[TL.shots.length - 1];
window.meta = { fps: TL.fps, duration: TL.duration };
window.renderFrame = (i) => {
  const t = i / TL.fps, shot = shotAt(t), lt = t - shot.t0, p = Math.min(1, lt / (shot.t1 - shot.t0));

  }

  scene.background = new THREE.Color(fogCol);
  sharedRain.visible = fx.includes('rain');
  if (sharedRain.visible) { const a = sharedRain.geometry.attributes.position, b = sharedRain.userData.base; for (let k = 0; k < a.count; k++) { let y = b[k * 3 + 1] - t * 9; y = ((y % 18) + 18) % 18; a.setXYZ(k, b[k * 3] + camera.position.x, y, b[k * 3 + 2] + camera.position.z); } a.needsUpdate = true; }
  sharedDust.visible = ['zimmer', 'stollen', 'leere'].includes(shot.set);
  if (sharedDust.visible) { const c0 = anchor(shot, shot.focus); sharedDust.position.set(c0.x, 0, c0.z); sharedDust.rotation.y = t * 0.03; }
  const set = sets[shot.set];
  if (set.g.userData.gears) set.g.userData.gears.children.forEach(g => g.rotation.z += g.userData.spin / TL.fps);
  if (set.g.userData.glow) set.g.userData.glow.intensity = (shot.set === 'stollen' ? 25 : 6) * (0.8 + 0.4 * Math.sin(t * 2.3));
  if (set.g.userData.dial) { const on = !fx.includes('flicker') || hash(Math.floor(t * 14)) > 0.3; set.g.userData.dial.material.color.setHex(on ? 0xffb04a : 0x2a1a08); set.g.userData.radioLight.intensity = on ? 3 + Math.sin(t * 20) : 0.2; set.g.userData.lamp.intensity = fx.includes('dark') ? 0.6 : 10; }

  // Glitch

  out.save(); out.globalAlpha = 0.07; out.globalCompositeOperation = 'overlay'; const ox = hash(i) * 256, oy = hash(i + 0.5) * 256; out.translate(-ox, -oy); out.fillStyle = out.createPattern(grain, 'repeat'); out.fillRect(0, 0, W + 256, H + 256); out.restore();

  out.restore();

  return document.getElementById('out').toDataURL('image/jpeg', 0.9).split(',')[1];
};
window.ready = true;
