// Figuren-Instanzen

// Passanten mit Regenschirmen, damit die Stadt lebt
{ const cols = [[0x4a3a2a, 0x22222a, 0x15151a], [0x2a3a4a, 0x1e1e22, 0x6a1a1a], [0x5a4a3a, 0x2a2a30, 0x1a2a3a], [0x3a2a3a, 0x202024, 0x101010]];

Object.values(chars).forEach(c => { c.visible = false; scene.add(c); });

// ---------- Kamera ----------

function placeCamera(shot, lt, p, t) {

const out = document.getElementById('out').getContext('2d');

{ const g = grain.getContext('2d'), d = g.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }

function wrap(text, maxW) { const words = text.split(' '), lines = []; let l = ''; for (const w of words) { const t = l ? l + ' ' + w : w; if (out.measureText(t).width > maxW && l) { lines.push(l); l = w; } else l = t; } lines.push(l); return lines; }
function subtitle(s, t) {

// ---------- Frame ----------
const shotAt = t => TL.shots.find(s => t >= s.t0 && t < s.t1) || TL.shots[TL.shots.length - 1];

window.renderFrame = (i) => {
